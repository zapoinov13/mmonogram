name: Проверки

# Проверка идёт на каждый push и pull request: разойтись справочник и данные
# сайта могут в любом коммите, а заметить это по выдаче можно только недели
# спустя, когда страница уже выпала из индекса.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Порядок тот же, что у npm run verify, и не случайно: сначала то, что
      # читает исходники и отвечает за секунды, потом трёхминутная сборка.
      #
      # Линтер и проверка типов здесь появились не сразу, и это дорого стоило:
      # ошибка prefer-const прожила в main больше двадцати коммитов при
      # полностью зелёном CI, потому что из пяти гейтов verify сюда попадали
      # только три. Зелёная галочка обязана означать, что verify проходит, —
      # иначе она означает лишь, что сайт собрался.
      - name: Линтер
        run: npm run lint
      - name: Типы
        run: npm run typecheck
      - name: Реестр машин конфигуратора
        run: npm run check:configurator
      - run: npm run build
      - run: npm run seo:check
      # Карта сайта и robots.txt собираются при сборке. Если после неё в
      # репозитории что-то изменилось — значит, их забыли закоммитить.
      - name: Карта сайта в репозитории не отстала
        run: git diff --exit-code -- public/sitemap.xml public/robots.txt
